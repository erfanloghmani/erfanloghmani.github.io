<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="ns-title ns-desc">
  <title id="ns-title">Non-stationary environment</title>
  <desc id="ns-desc">Outcome relationships can change over time: lines that shift regime along the timeline.</desc>
  <defs>
    <marker id="ns-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b2e83"/>
    </marker>
    <style type="text/css"><![CDATA[
      .sub { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #5a5368; }
      .axis { stroke: #4b2e83; stroke-width: 1.75; fill: none; marker-end: url(#ns-arrow); }
      .grid { stroke: rgba(75,46,131,.12); stroke-width: 1; }
      .l1 { fill: none; stroke: #4b2e83; stroke-width: 2.75; stroke-linecap: round; stroke-linejoin: round; }
      .l2 { fill: none; stroke: #6a9cc4; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .l3 { fill: none; stroke: #85754d; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 6 4; }
      .regime { fill: rgba(196,122,122,.12); stroke: none; }
      .divider { stroke: #c47a7a; stroke-width: 1.75; stroke-dasharray: 4 3; }
    ]]></style>
  </defs>

  <rect x="60" y="28" width="440" height="180" rx="8" fill="#fff" stroke="rgba(75,46,131,.18)" stroke-width="1.5"/>

  <rect class="regime" x="60" y="28" width="146" height="180"/>
  <rect class="regime" x="354" y="28" width="146" height="180" style="fill:rgba(106,156,196,.12)"/>

  <line class="grid" x1="60" y1="73" x2="500" y2="73"/>
  <line class="grid" x1="60" y1="118" x2="500" y2="118"/>
  <line class="grid" x1="60" y1="163" x2="500" y2="163"/>

  <line class="axis" x1="60" y1="208" x2="510" y2="208"/>
  <line class="axis" x1="60" y1="208" x2="60" y2="18"/>
  <text class="sub" x="280" y="232" text-anchor="middle">time</text>
  <text class="sub" x="42" y="120" text-anchor="middle" transform="rotate(-90 42 120)">outcome</text>

  <line class="divider" x1="206" y1="28" x2="206" y2="208"/>
  <line class="divider" x1="354" y1="28" x2="354" y2="208"/>
  <text class="sub" x="133" y="46" text-anchor="middle" style="fill:#c47a7a;font-weight:700">regime A</text>
  <text class="sub" x="280" y="46" text-anchor="middle" style="fill:#85754d;font-weight:700">shift</text>
  <text class="sub" x="427" y="46" text-anchor="middle" style="fill:#6a9cc4;font-weight:700">regime B</text>

  <path class="l1" d="M 78 170
    C 110 160, 140 145, 170 135
    C 190 128, 200 120, 206 115
    C 230 100, 260 110, 290 105
    C 320 100, 340 115, 354 125
    C 380 145, 420 160, 480 175"/>

  <path class="l2" d="M 78 120
    C 120 118, 160 122, 206 120
    C 240 118, 280 110, 320 90
    C 354 70, 400 65, 480 55"/>

  <path class="l3" d="M 78 80
    C 120 85, 160 95, 206 105
    C 250 115, 300 130, 354 140
    C 390 148, 430 155, 480 160"/>

  <line class="l1" x1="90" y1="256" x2="118" y2="256"/>
  <text class="sub" x="124" y="260">series 1</text>
  <line class="l2" x1="210" y1="256" x2="238" y2="256"/>
  <text class="sub" x="244" y="260">series 2</text>
  <line class="l3" x1="330" y1="256" x2="358" y2="256"/>
  <text class="sub" x="364" y="260">series 3</text>
</svg>
