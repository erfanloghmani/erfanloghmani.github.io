<div class="llm-intro" aria-hidden="true">
  <span class="llm-grown fragment" data-step="2"></span>

  <div class="llm-flow">
    <div class="llm-inputs fragment" data-step="3">
      <div class="llm-chip">
        <svg class="llm-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M14 8h16l8 8v24a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="2.4"/>
          <path d="M30 8v8h8" stroke="currentColor" stroke-width="2.4"/>
          <path d="M18 24h12M18 30h12M18 36h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span>Books</span>
      </div>
      <div class="llm-chip">
        <svg class="llm-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <rect x="10" y="8" width="28" height="32" rx="3" stroke="currentColor" stroke-width="2.4"/>
          <path d="M16 16h16M16 22h16M16 28h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span>Articles</span>
      </div>
      <div class="llm-chip">
        <svg class="llm-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="14" stroke="currentColor" stroke-width="2.4"/>
          <path d="M10 24h28M24 10c4.5 4.8 7 9.5 7 14s-2.5 9.2-7 14c-4.5-4.8-7-9.5-7-14s2.5-9.2 7-14z" stroke="currentColor" stroke-width="2.2"/>
        </svg>
        <span>Webpages</span>
      </div>
      <div class="llm-arrow llm-arrow-in">→</div>
    </div>

    <div class="llm-model fragment" data-step="1">
      <div class="llm-model-box">
        <span class="llm-model-label">Model</span>
      </div>
    </div>

    <div class="llm-outputs fragment" data-step="4">
      <div class="llm-arrow llm-arrow-out">→</div>
      <div class="llm-answer">
        <svg class="llm-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M10 14a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H22l-8 8v-8h-4a6 6 0 0 1-6-6V14z" stroke="currentColor" stroke-width="2.4"/>
          <path d="M18 18h12M18 24h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span>Answers</span>
      </div>
      <div class="llm-answer llm-answer-soft">
        <span>Language &amp; conversation</span>
      </div>
    </div>
  </div>

  <div class="llm-uses fragment" data-step="5">
    <div class="llm-use">
      <img class="llm-use-img" src="images/upworthy-screenshot.avif" alt="">
      <div class="llm-use-text">
        <strong>Headlines</strong>
        <span>for news articles</span>
        <span class="llm-use-cite">\citet{chen2024large, ye2025lola}</span>
      </div>
    </div>
    <div class="llm-use">
      <img class="llm-use-img" src="images/email-marketing.avif" alt="">
      <div class="llm-use-text">
        <strong>Emails</strong>
        <span>marketing copy</span>
        <span class="llm-use-cite">\citet{angelopoulos2024value, dube2026large}</span>
      </div>
    </div>
    <div class="llm-use">
      <img class="llm-use-img" src="images/ai-photo.jpg" alt="">
      <div class="llm-use-text">
        <strong>Product photos</strong>
        <span>and videos</span>
        <span class="llm-use-cite">\citet{daviet2026leveraging, heitmann2026picture}</span>
      </div>
    </div>
  </div>
</div>
