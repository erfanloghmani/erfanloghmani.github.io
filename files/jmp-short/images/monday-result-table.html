    <div class="mon-res-h mon-res-h-fri" style="grid-area:1 / 4">
      <span class="mon-res-h-text">“Friday” (%)</span>

    <div class="mon-res-cell mon-res-label mon-res-r1" style="grid-area:2 / 1">Pretrained language model</div>
    <div class="mon-res-cell mon-res-method mon-res-r1" style="grid-area:2 / 2">Base</div>

    <div class="mon-res-cell mon-res-label mon-res-r2" style="grid-area:3 / 1">Adapting the model to domain</div>
    <div class="mon-res-cell mon-res-method mon-res-r2" style="grid-area:3 / 2">SFT</div>
    <div class="mon-res-cell mon-res-num mon-res-r2" style="grid-area:3 / 3">11.45</div>
    <div class="mon-res-cell mon-res-num mon-res-r2" style="grid-area:3 / 4"><strong>8.88</strong></div>

      <div class="mon-res-delta mon-res-down">
