<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="time-title time-desc">
  <title id="time-title">Temporal experimentation setting</title>
  <desc id="time-desc">Three months of observational history, then sequential decide-to-test or commit for each arriving test.</desc>
  <defs>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b2e83"/>
    </marker>
    <style type="text/css"><![CDATA[
      .hist { fill: #fdeeee; stroke: #c47a7a; stroke-width: 2; }
      .fut { fill: #eaf4fc; stroke: #6a9cc4; stroke-width: 2; }
      .act-exp { fill: #efeaf8; stroke: #4b2e83; stroke-width: 2; }
      .act-com { fill: #ffffff; stroke: #85754d; stroke-width: 2; }
      .goal { fill: #f7f5f2; stroke: #4b2e83; stroke-width: 2; }
      .hdr { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; fill: #85754d; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #4b2e83; }
      .sub { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #5a5368; }
      .axis { stroke: #4b2e83; stroke-width: 2.75; fill: none; marker-end: url(#arrow-t); }
      .tick { stroke: #4b2e83; stroke-width: 2.25; }
    ]]></style>
  </defs>

  <!-- Timeline axis -->
  <line class="axis" x1="40" y1="40" x2="680" y2="40"/>
  <line class="tick" x1="220" y1="30" x2="220" y2="50"/>
  <text class="hdr" x="130" y="22" text-anchor="middle">HISTORY (3 MONTHS)</text>
  <text class="hdr" x="450" y="22" text-anchor="middle">GOING FORWARD (TEST BY TEST)</text>

  <!-- History panel -->
  <rect class="hist" x="28" y="64" width="180" height="148" rx="14"/>
  <text class="label" x="118" y="128" text-anchor="middle">Observational</text>
  <text class="sub" x="118" y="156" text-anchor="middle">1 headline / test</text>

  <!-- Forward panel -->
  <rect class="fut" x="224" y="64" width="468" height="148" rx="14"/>
  <text class="label" x="458" y="96" text-anchor="middle">Each arriving test: choose an action</text>

  <rect class="act-exp" x="248" y="112" width="168" height="80" rx="12"/>
  <text class="label" x="332" y="146" text-anchor="middle">Experiment</text>
  <text class="sub" x="332" y="172" text-anchor="middle">see all arms</text>

  <text class="label" x="458" y="160" text-anchor="middle">or</text>

  <rect class="act-com" x="488" y="112" width="180" height="80" rx="12"/>
  <text class="label" x="578" y="140" text-anchor="middle">Choose</text>
  <text class="sub" x="578" y="164" text-anchor="middle">one headline and</text>
  <text class="sub" x="578" y="184" text-anchor="middle">serve only that</text>

  <!-- Goal -->
  <rect class="goal" x="28" y="232" width="664" height="88" rx="14"/>
  <text class="hdr" x="360" y="266" text-anchor="middle">OBJECTIVE</text>
  <text class="label" x="360" y="298" text-anchor="middle">Maximize clicks</text>
</svg>
