<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="arr-title arr-desc">
  <title id="arr-title">Data arrives over time</title>
  <desc id="arr-desc">Real-world collection is sequential: tests arrive along a timeline, not as a random pool.</desc>
  <defs>
    <marker id="arr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b2e83"/>
    </marker>
    <style type="text/css"><![CDATA[
      .axis { stroke: #4b2e83; stroke-width: 2.5; fill: none; marker-end: url(#arr-arrow); }
      .tick { stroke: #4b2e83; stroke-width: 2; }
      .hdr { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.05em; fill: #85754d; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #4b2e83; }
      .sub { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #5a5368; }
      .card { fill: #eaf4fc; stroke: #6a9cc4; stroke-width: 1.75; }
      .card-late { fill: #efeaf8; stroke: #4b2e83; stroke-width: 1.75; }
    ]]></style>
  </defs>

  <text class="hdr" x="280" y="48" text-anchor="middle">REAL-WORLD COLLECTION</text>
  <text class="label" x="280" y="78" text-anchor="middle">Tests arrive with time ? not as a shuffled pool</text>

  <!-- Timeline -->
  <line class="axis" x1="40" y1="140" x2="520" y2="140"/>
  <text class="sub" x="40" y="126">past</text>
  <text class="sub" x="500" y="126" text-anchor="end">future</text>

  <!-- Arriving cards along timeline -->
  <rect class="card" x="56" y="168" width="72" height="54" rx="10"/>
  <text class="label" x="92" y="192" text-anchor="middle" style="font-size:15px">Test 1</text>
  <text class="sub" x="92" y="210" text-anchor="middle">t1</text>
  <line class="tick" x1="92" y1="132" x2="92" y2="148"/>

  <rect class="card" x="156" y="168" width="72" height="54" rx="10"/>
  <text class="label" x="192" y="192" text-anchor="middle" style="font-size:15px">Test 2</text>
  <text class="sub" x="192" y="210" text-anchor="middle">t2</text>
  <line class="tick" x1="192" y1="132" x2="192" y2="148"/>

  <rect class="card" x="256" y="168" width="72" height="54" rx="10"/>
  <text class="label" x="292" y="192" text-anchor="middle" style="font-size:15px">Test 3</text>
  <text class="sub" x="292" y="210" text-anchor="middle">t3</text>
  <line class="tick" x1="292" y1="132" x2="292" y2="148"/>

  <rect class="card-late" x="356" y="168" width="72" height="54" rx="10"/>
  <text class="label" x="392" y="192" text-anchor="middle" style="font-size:15px">Test 4</text>
  <text class="sub" x="392" y="210" text-anchor="middle">t4</text>
  <line class="tick" x1="392" y1="132" x2="392" y2="148"/>

  <rect class="card-late" x="456" y="168" width="72" height="54" rx="10"/>
  <text class="label" x="492" y="192" text-anchor="middle" style="font-size:15px">Test 5</text>
  <text class="sub" x="492" y="210" text-anchor="middle">t5</text>
  <line class="tick" x1="492" y1="132" x2="492" y2="148"/>
</svg>
